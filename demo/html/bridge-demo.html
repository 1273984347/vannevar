/* ========== 主题切换 ========== */
function safeGetItem(key) {
  try { return localStorage.getItem(key); } catch (e) { return null; }
}
function safeSetItem(key, value) {
  try { localStorage.setItem(key, value); } catch (e) {}
}
function safeRemoveItem(key) {
  try { localStorage.removeItem(key); } catch (e) {}
}
function initTheme() {
  const toggle = document.getElementById('theme-toggle');
  const isDarkSystem = window.matchMedia('(prefers-color-scheme: dark)').matches;
  // 读取本地存储
  const saved = safeGetItem('bridge-theme');
  if (saved === 'dark') {
    document.documentElement.setAttribute('data-theme', 'dark');
    toggle.innerHTML = '<span aria-hidden="true">☀️</span>';
  } else if (saved === 'light') {
    document.documentElement.setAttribute('data-theme', 'light');
    toggle.innerHTML = '<span aria-hidden="true">🌙</span>';
  } else {
    // 无本地存储时跟随系统偏好，设置对应图标
    toggle.innerHTML = isDarkSystem ? '<span aria-hidden="true">☀️</span>' : '<span aria-hidden="true">🌙</span>';
  }
  const currentTheme = document.documentElement.getAttribute('data-theme');
  const effectivelyDark = currentTheme === 'dark' || (!currentTheme && isDarkSystem);
  toggle.setAttribute('aria-pressed', String(effectivelyDark));
  toggle.addEventListener('click', function () {
    const current = document.documentElement.getAttribute('data-theme');
    const isDarkSystem = window.matchMedia('(prefers-color-scheme: dark)').matches;
    const effectivelyDark = current === 'dark' || (!current && isDarkSystem);
    if (effectivelyDark) {
      document.documentElement.setAttribute('data-theme', 'light');
      safeSetItem('bridge-theme', 'light');
      toggle.innerHTML = '<span aria-hidden="true">🌙</span>';
      toggle.setAttribute('aria-pressed', 'false');
    } else {
      document.documentElement.setAttribute('data-theme', 'dark');
      safeSetItem('bridge-theme', 'dark');
      toggle.innerHTML = '<span aria-hidden="true">☀️</span>';
      toggle.setAttribute('aria-pressed', 'true');
    }
  });
}

/* ========== 影响力仪表盘 ========== */
// 各项目模拟受益人数（按项目 id 索引，保证稳定）
// 使用 let 以便新项目动态注册（const 会导致新项目永远查不到受益人数）
let IMPACT_BENEFICIARIES = { p1: 320, p2: 580, p3: 384 };

// 统一受益人数查询：优先取 project.beneficiaries，其次查 IMPACT_BENEFICIARIES，最后回退 100
// 修复 P1-12：原 computeKPIs 回退 0、排行榜/predictProjectImpact 回退 100 不一致
function getProjectBeneficiaries(p) {
  if (!p) return 100;
  if (p.beneficiaries != null) return p.beneficiaries;
  if (IMPACT_BENEFICIARIES[p.id] != null) return IMPACT_BENEFICIARIES[p.id];
  return 100;
}

function computeKPIs() {
  let totalTasks = 0, doneTasks = 0, activeVolunteers = new Set();
  PROJECTS.forEach(p => {
    if (p.tasks) {
      p.tasks.forEach(t => {
        totalTasks++;
        if (t.status === 'done') doneTasks++;
        if (t.owner) activeVolunteers.add(t.owner);
      });
    }
  });
  const completionRate = totalTasks > 0 ? Math.round((doneTasks / totalTasks) * 100) : 0;
  // 项目完成率：所有任务均为 done 的项目占比
  const completedProjects = PROJECTS.filter(p => {
    if (!p.tasks || p.tasks.length === 0) return false;
    return p.tasks.every(t => t.status === 'done');
  }).length;
  const projectCompletionRate = PROJECTS.length > 0 ? Math.round((completedProjects / PROJECTS.length) * 100) : 0;
  return {
    completionRate: completionRate,
    projectCompletionRate: projectCompletionRate,
    activeVolunteers: activeVolunteers.size,
    totalProjects: PROJECTS.length,
    totalBeneficiaries: PROJECTS.reduce((s, p) => s + getProjectBeneficiaries(p), 0)
  };
}

function renderImpact() {
  // 防止重复进入累积定时器
  if (impactPredictionTimer) { clearTimeout(impactPredictionTimer); impactPredictionTimer = null; }
  // 已在 impact 视图且预测网格已有真实内容（非骨架屏）时，
  // 备份已采纳的 prediction-grid DOM，重建整页（更新 KPI/环形图/排行榜），再恢复 grid 并刷新预测，
  // 避免采纳建议后 adopted 视觉态在 800ms 骨架屏期间短暂消失，同时保证 KPI 实时更新
  var savedGrid = null;
  var existingGrid = document.getElementById('prediction-grid');
  if (state.view === 'impact' && existingGrid && existingGrid.children.length > 0 && !existingGrid.querySelector('.prediction-skeleton')) {
    savedGrid = existingGrid.cloneNode(true);  // 保留已采纳的卡片视觉态
  }
  // ---- A. 顶部 KPI 卡片 ----（动态计算，趋势与上一次快照对比）
  const kpiData = computeKPIs();
  const prev = lastImpactKPIs;
  function formatTrend(current, previous, isPercentagePoint) {
    if (prev == null || previous == null) return '—';
    const delta = current - previous;
    if (delta === 0) return '—';
    const sign = delta > 0 ? '+' : '';
    return isPercentagePoint ? sign + delta + 'pt' : sign + delta;
  }
  const kpis = [
    { icon: '👥', value: kpiData.totalBeneficiaries.toLocaleString(), suffix: ' 人', label: '累计受益人数', trend: formatTrend(kpiData.totalBeneficiaries, prev && prev.totalBeneficiaries, false), trendLabel: '较上周' },
    { icon: '📁', value: String(kpiData.totalProjects), suffix: ' 个', label: '进行中项目', trend: formatTrend(kpiData.totalProjects, prev && prev.totalProjects, false), trendLabel: '本月新增' },
    { icon: '✅', value: String(kpiData.completionRate), suffix: '%', label: '任务完成率', trend: formatTrend(kpiData.completionRate, prev && prev.completionRate, true), trendLabel: '较上周' },
    { icon: '🙌', value: String(kpiData.activeVolunteers), suffix: ' 人', label: '活跃志愿者', trend: formatTrend(kpiData.activeVolunteers, prev && prev.activeVolunteers, false), trendLabel: '本周新增' }
  ];
  lastImpactKPIs = {
    totalBeneficiaries: kpiData.totalBeneficiaries,
    totalProjects: kpiData.totalProjects,
    completionRate: kpiData.completionRate,
    activeVolunteers: kpiData.activeVolunteers
  };

  let kpiHtml = '<div class="kpi-grid">';
  kpis.forEach(function (k) {
    kpiHtml += '<div class="kpi-card">';
    kpiHtml += '  <div class="kpi-top">';
    kpiHtml += '    <div class="kpi-icon" aria-hidden="true">' + k.icon + '</div>';
    kpiHtml += '    <span class="kpi-trend"><span aria-hidden="true">↑</span> ' + escapeHtml(k.trend) + '</span>';
    kpiHtml += '    <span class="kpi-trend-label">' + escapeHtml(k.trendLabel) + '</span>';
    kpiHtml += '  </div>';
    kpiHtml += '  <div class="kpi-value">' + escapeHtml(k.value) + escapeHtml(k.suffix) + '</div>';
    kpiHtml += '  <div class="kpi-label">' + escapeHtml(k.label) + '</div>';
    kpiHtml += '  <div class="kpi-footnote" style="font-size:11px;color:var(--text-subtle);margin-top:4px;">实时计算 · 基于 ' + kpiData.totalProjects + ' 个项目</div>';
    kpiHtml += '</div>';
  });
  kpiHtml += '</div>';

  // ---- B. 中间环形进度图 ----
  // 三个同心环：r=80/60/40，分别代表项目完成率/任务完成率/志愿者参与率
  // 任务完成率与活跃志愿者参与率复用顶部 KPI 计算结果，避免重复调用 computeKPIs()
  const ringData = kpiData;
  const volunteerParticipation = ringData.activeVolunteers > 0 ? Math.min(100, Math.round((ringData.activeVolunteers / 12) * 100)) : 0;
  // 环颜色使用 CSS token，自动适配深色模式
  const rings = [
    { r: 80, percent: ringData.projectCompletionRate, cssVar: '--status-completed', label: '项目完成率' },
    { r: 60, percent: ringData.completionRate, cssVar: '--status-active', label: '任务完成率' },
    { r: 40, percent: volunteerParticipation, cssVar: '--status-pending', label: '志愿者参与率' }
  ];

  let svgHtml = '<svg class="ring-svg" viewBox="0 0 200 200" aria-label="影响力环形图">';
  rings.forEach(function (ring) {
    const circumference = 2 * Math.PI * ring.r;
    const offset = circumference * (1 - ring.percent / 100);
    svgHtml += '<circle class="ring-track" cx="100" cy="100" r="' + ring.r + '"/>';
    svgHtml += '<circle class="ring-bar ring-bar-anim" cx="100" cy="100" r="' + ring.r + '" stroke="var(' + ring.cssVar + ')" transform="rotate(-90 100 100)" stroke-dasharray="' + circumference.toFixed(2) + '" style="--ring-circumference:' + circumference.toFixed(2) + ';--ring-offset:' + offset.toFixed(2) + '"/>';
  });
  svgHtml += '</svg>';

  let midHtml = '<div class="impact-mid">';
  midHtml += '  <div class="ring-wrap">';
  midHtml += '    <div class="ring-figure">' + svgHtml;
  midHtml += '      <div class="ring-center">';
  midHtml += '        <div class="ring-center-value">' + ringData.projectCompletionRate + '%</div>';
  midHtml += '        <div class="ring-center-label">项目完成率</div>';
  midHtml += '      </div>';
  midHtml += '    </div>';
  midHtml += '  </div>';
  midHtml += '  <div class="ring-legend">';
  rings.forEach(function (ring) {
    midHtml += '    <div class="ring-legend-item">';
    midHtml += '      <span class="ring-legend-dot" style="background:var(' + ring.cssVar + ')"></span>';
    midHtml += '      <span class="ring-legend-text">' + escapeHtml(ring.label) + '</span>';
    midHtml += '      <span class="ring-legend-value">' + ring.percent + '%</span>';
    midHtml += '    </div>';
  });
  midHtml += '  </div>';
  midHtml += '</div>';

  // ---- C. 项目影响力排行 ----
  // 影响力得分 = 受益人数 × 任务完成率
  const ranked = PROJECTS.map(function (p) {
    const counts = countTasks(p);
    const total = counts.todo + counts.in_progress + counts.done;
    const rate = total > 0 ? counts.done / total : 0;
    const beneficiaries = getProjectBeneficiaries(p);
    const score = Math.round(beneficiaries * rate);
    return { name: p.name, score: score };
  }).sort(function (a, b) { return b.score - a.score; });

  const maxScore = ranked.length > 0
    ? Math.max.apply(null, ranked.map(function (r) { return r.score; }))
    : 1;

  let rankHtml = '<div class="impact-rank">';
  rankHtml += '  <h3 class="impact-rank-title">项目影响力排行</h3>';
  if (ranked.length === 0) {
    rankHtml += '  <div class="rank-row"><div class="rank-name">暂无数据</div></div>';
  } else {
    ranked.forEach(function (item, idx) {
      const widthPct = maxScore > 0 ? (item.score / maxScore * 100) : 0;
      rankHtml += '  <div class="rank-row">';
      rankHtml += '    <div class="rank-index">' + (idx + 1) + '</div>';
      rankHtml += '    <div class="rank-name">' + escapeHtml(item.name) + '</div>';
      rankHtml += '    <div class="rank-bar"><div class="rank-bar-fill" style="width:' + widthPct.toFixed(1) + '%"></div></div>';
      rankHtml += '    <div class="rank-score">' + item.score + '</div>';
      rankHtml += '  </div>';
    });
  }
  rankHtml += '</div>';

  // ---- 组装 ----
  let html = '<div class="impact-page">';
  html += '  <div class="impact-header">';
  html += '    <h1 class="impact-title">影响力仪表盘</h1>';
  html += '    <div class="impact-subtitle">量化公益项目的社会价值，让每一份善意都被看见</div>';
  html += '  </div>';
  html += kpiHtml;
  html += midHtml;
  html += rankHtml;

  // ---- D. AI 影响力预测（骨架屏，800ms 后填充）----
  html += '<div class="impact-prediction">';
  html += '  <div class="prediction-header">';
  html += '    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 17l6-6 4 4 8-8"/><path d="M14 7h7v7"/></svg>';
  html += '    <h3>AI 影响力预测</h3>';
  html += '    <span class="prediction-confidence medium">AI 计算中…</span>';
  html += '  </div>';
  html += '  <div class="prediction-grid" id="prediction-grid">';
  html += '    <div class="prediction-skeleton"></div>';
  html += '    <div class="prediction-skeleton"></div>';
  html += '    <div class="prediction-skeleton"></div>';
  html += '  </div>';
  html += '</div>';

  html += '</div>';

  elImpact.innerHTML = html;

  // 守卫命中时：用备份的已采纳 grid 替换骨架屏，直接刷新预测（跳过 800ms 骨架屏）
  if (savedGrid) {
    var newGrid = document.getElementById('prediction-grid');
    if (newGrid) newGrid.parentNode.replaceChild(savedGrid, newGrid);
    renderImpactPrediction();
    return;
  }

  // 模拟 AI 计算：800ms 后渲染预测结果
  impactPredictionTimer = setTimeout(renderImpactPrediction, 800);
}

/* ========== AI 影响力预测算法 ========== */
// 估算项目已运行天数：优先使用 project.createdAt 真实运行天数
// 否则按 updatedAt 外推（"刚刚"时 hoursAgo≈0，会导致永远 10 天）
function estimateRunDays(project) {
  if (project.createdAt) {
    const days = (Date.now() - project.createdAt) / 86400000;
    if (days > 0) return Math.max(1, days);
  }
  const hoursAgo = updatedAtScore(project.updatedAt);
  return Math.max(1, 10 + hoursAgo / 24);
}

// 日期格式化为 "M月D日"
function formatCNDate(d) {
  return (d.getMonth() + 1) + '月' + d.getDate() + '日';
}

// 基于任务完成速率、志愿者活跃度、历史数据预测项目影响力
function predictProjectImpact(project) {
  const counts = countTasks(project);
  const total = counts.todo + counts.in_progress + counts.done;
  const done = counts.done;

  if (total === 0) {
    return {
      empty: true,
      confidence: 0,
      factors: [],
      recommendation: '数据不足，建议补充更多任务记录',
      recommendationLevel: 'danger'
    };
  }

  const progressRate = done / total;

  // A. 完成时间预测（线性回归）
  const runDays = estimateRunDays(project);
  const completionSpeed = done / runDays; // 任务/天
  const remaining = total - done;
  const stalled = completionSpeed <= 0;
  const remainingDays = stalled ? Infinity : (remaining / completionSpeed);
  const completionDate = new Date(Date.now() + (isFinite(remainingDays) ? remainingDays * 86400000 : 0));

  // B. 受益人数预测
  const targetBeneficiaries = getProjectBeneficiaries(project);
  const predictedCompletionRate = stalled ? progressRate : 1;
  const finalRate = Math.min(1, predictedCompletionRate);
  let estimatedBeneficiaries = targetBeneficiaries * finalRate;
  if (predictedCompletionRate < 0.7) {
    estimatedBeneficiaries *= (predictedCompletionRate / 0.7);
  }
  estimatedBeneficiaries = Math.round(estimatedBeneficiaries);

  // C. 置信度计算（0-100%）
  const volunteers = {};
  project.tasks.forEach(function (t) { if (t.owner) volunteers[t.owner] = true; });
  const volunteerCount = Object.keys(volunteers).length;
  let confidence = 0;
  if (total > 5) confidence += 20;                                  // 数据点充足
  if (progressRate > 0 && progressRate < 1) confidence += 20;       // 完成速率稳定（仍在推进）
  if (volunteerCount > 3) confidence += 20;                          // 志愿者活跃
  if (runDays > 7) confidence += 20;                                 // 运行时间充足
  if (IMPACT_BENEFICIARIES[project.id] != null) confidence += 20;   // 历史相似项目参考
  confidence = Math.min(100, confidence);

  // D. 影响因素
  const factors = [
    '任务完成速率：' + completionSpeed.toFixed(2) + ' 任务/天',
    '志愿者活跃度：' + volunteerCount + ' 人',
    '当前进度：' + Math.round(progressRate * 100) + '%',
    stalled ? '项目已停滞' : '预计还需 ' + Math.ceil(remainingDays) + ' 天'
  ];

  // E. 建议
  let recommendation, recommendationLevel;
  if (confidence < 40) {
    recommendation = '数据不足，建议补充更多任务记录';
    recommendationLevel = 'danger';
  } else if (!stalled && remainingDays > 30) {
    recommendation = '进度滞后，建议增加志愿者或拆分任务';
    recommendationLevel = 'warning';
  } else if (estimatedBeneficiaries < targetBeneficiaries * 0.5) {
    recommendation = '预计无法达成目标，建议调整策略';
    recommendationLevel = 'danger';
  } else if (stalled) {
    recommendation = '进度停滞，建议增加志愿者或拆分任务';
    recommendationLevel = 'warning';
  } else {
    recommendation = '进度健康，按当前节奏可如期完成';
    recommendationLevel = 'healthy';
  }

  return {
    empty: false,
    total: total,
    done: done,
    progressRate: progressRate,
    runDays: runDays,
    completionSpeed: completionSpeed,
    stalled: stalled,
    remainingDays: remainingDays,
    completionDate: completionDate,
    targetBeneficiaries: targetBeneficiaries,
    estimatedBeneficiaries: estimatedBeneficiaries,
    confidence: confidence,
    factors: factors,
    recommendation: recommendation,
    recommendationLevel: recommendationLevel,
    volunteerCount: volunteerCount
  };
}

// 渲染 AI 影响力预测卡片
function renderImpactPrediction() {
  impactPredictionTimer = null;
  // 切出 impact 视图后不再渲染预测结果，避免无效 DOM 操作
  if (state.view !== 'impact') return;
  const grid = document.getElementById('prediction-grid');
  if (!grid) return;

  // 头部置信度徽标使用平均置信度
  const predictions = PROJECTS.map(predictProjectImpact);
  const valid = predictions.filter(function (p) { return !p.empty; });
  const confidenceBadge = document.querySelector('.impact-prediction .prediction-confidence');
  if (confidenceBadge) {
    if (valid.length === 0) {
      // 所有项目均无可用预测，避免显示误导性的"置信度 0%"
      confidenceBadge.textContent = '暂无可用预测';
      confidenceBadge.classList.remove('low', 'medium', 'high');
    } else {
      const avgConfidence = Math.round(valid.reduce(function (s, p) { return s + p.confidence; }, 0) / valid.length);
      confidenceBadge.textContent = '置信度 ' + avgConfidence + '%';
      confidenceBadge.classList.remove('medium', 'low');
      if (avgConfidence < 40) {
        confidenceBadge.classList.add('low');
      } else if (avgConfidence < 70) {
        confidenceBadge.classList.add('medium');
      }
    }
  }

  let html = '';
  PROJECTS.forEach(function (p, idx) {
    const pred = predictions[idx];
    if (pred.empty) {
      html += '<div class="prediction-card" data-project-id="' + escapeHtml(p.id) + '">';
      html += '  <div class="prediction-card-header"><div class="prediction-card-name">' + escapeHtml(p.name) + '</div></div>';
      html += '  <div class="prediction-empty">暂无数据</div>';
      html += '</div>';
      return;
    }
    const confClass = pred.confidence < 40 ? 'low' : (pred.confidence < 70 ? 'medium' : '');
    const dateStr = pred.stalled ? '—' : formatCNDate(pred.completionDate);
    const daysSub = pred.stalled ? '已停滞' : '还有 ' + Math.ceil(pred.remainingDays) + ' 天';
    const benePct = pred.targetBeneficiaries > 0
      ? Math.min(100, Math.round(pred.estimatedBeneficiaries / pred.targetBeneficiaries * 100))
      : 0;
    const progressPct = Math.round(pred.progressRate * 100);
    const ringCirc = 2 * Math.PI * 7;
    const ringOffset = ringCirc * (1 - progressPct / 100);
    const recIcon = pred.recommendationLevel === 'healthy' ? '✓' : (pred.recommendationLevel === 'warning' ? '⚠' : '✕');
    const factorsTitle = pred.factors.join('\n');
    // 检查该 recommendationLevel 是否已被采纳，已采纳则禁用按钮防止重复触发
    p.adoptedActions = p.adoptedActions || [];
    const isAdopted = p.adoptedActions.indexOf(pred.recommendationLevel) >= 0;
    const recClass = pred.recommendationLevel + (isAdopted ? ' adopted' : '');
    const recDisabledAttr = isAdopted ? ' disabled' : '';

    html += '<div class="prediction-card" data-project-id="' + escapeHtml(p.id) + '" title="' + escapeHtml(factorsTitle) + '">';
    html += '  <div class="prediction-card-header">';
    html += '    <div class="prediction-card-name">' + escapeHtml(p.name) + '</div>';
    html += '    <span class="prediction-confidence ' + confClass + '">置信度 ' + pred.confidence + '%</span>';
    html += '  </div>';
    html += '  <div class="prediction-metrics">';
    html += '    <div class="prediction-metric">';
    html += '      <div class="prediction-metric-label">预计完成</div>';
    html += '      <div class="prediction-metric-value">' + escapeHtml(dateStr) + '</div>';
    html += '      <div class="prediction-metric-sub">' + escapeHtml(daysSub) + '</div>';
    html += '    </div>';
    html += '    <div class="prediction-metric">';
    html += '      <div class="prediction-metric-label">预计受益</div>';
    html += '      <div class="prediction-metric-value">' + pred.estimatedBeneficiaries + ' 人</div>';
    html += '      <div class="prediction-metric-bar"><div class="prediction-metric-bar-fill" style="width:' + benePct + '%"></div></div>';
    html += '    </div>';
    html += '    <div class="prediction-metric">';
    html += '      <div class="prediction-metric-label">当前进度</div>';
    html += '      <div class="prediction-metric-value">' + progressPct + '%';
    html += '        <svg class="prediction-mini-ring" viewBox="0 0 18 18" aria-hidden="true">';
    html += '          <circle class="prediction-mini-ring-track" cx="9" cy="9" r="7"/>';
    html += '          <circle class="prediction-mini-ring-bar" cx="9" cy="9" r="7" transform="rotate(-90 9 9)" stroke-dasharray="' + ringCirc.toFixed(2) + '" stroke-dashoffset="' + ringOffset.toFixed(2) + '"/>';
    html += '        </svg>';
    html += '      </div>';
    html += '      <div class="prediction-metric-sub">' + pred.done + '/' + pred.total + ' 任务</div>';
    html += '    </div>';
    html += '    <div class="prediction-metric">';
    html += '      <div class="prediction-metric-label">任务速率</div>';
    html += '      <div class="prediction-metric-value">' + pred.completionSpeed.toFixed(2) + '</div>';
    html += '      <div class="prediction-metric-sub">任务/天</div>';
    html += '    </div>';
    html += '  </div>';
    html += '  <div class="prediction-factors">';
    pred.factors.forEach(function (f) {
      html += '    <span class="prediction-factor">' + escapeHtml(f) + '</span>';
    });
    html += '  </div>';
    html += '  <button type="button" class="prediction-recommendation ' + recClass + '" data-pred-idx="' + idx + '" aria-label="采纳建议"' + recDisabledAttr + '>';
    html += '    <span class="prediction-recommendation-icon">' + recIcon + '</span>';
    html += '    <span class="prediction-recommendation-text">' + escapeHtml(pred.recommendation) + '</span>';
    html += '    <span class="prediction-recommendation-adopt">采纳</span><span class="adopt-mark"> ✓</span>';
    html += '  </button>';
    html += '</div>';
  });
  grid.innerHTML = html;

  // 采纳建议：事件委托
  grid.onclick = function(e) {
    const card = e.target.closest('.prediction-recommendation');
    if (!card) return;
    if (card.disabled) return;
    const idx = parseInt(card.dataset.predIdx, 10);
    const pred = predictions[idx];
    if (!pred) return;
    card.disabled = true;
    card.classList.add('adopted');
    const project = PROJECTS[idx];
    // 在 project 上记录已采纳的 recommendationLevel，renderImpact 重建 DOM 后据此恢复 adopted 状态
    if (project) {
      project.adoptedActions = project.adoptedActions || [];
      if (project.adoptedActions.indexOf(pred.recommendationLevel) < 0) {
        project.adoptedActions.push(pred.recommendationLevel);
      }
    }
    // 按 recommendationLevel 执行真实闭环动作
    if (pred.recommendationLevel === 'healthy') {
      // 进度健康：在项目留言中添加一条 AI 系统建议
      if (project) {
        project.messages.push({
          id: 'm' + (state.nextTaskId++),
          author: 'AI助手',
          content: 'AI 建议：项目进度健康，可考虑提前下一阶段',
          time: '刚刚',
          me: false
        });
      }
      showToast('已采纳：已记录建议到项目留言', 'success');
      renderImpact();
    } else if (pred.recommendationLevel === 'warning') {
      // 滞后：为该项目创建一条新关注任务
      if (project) {
        project.tasks.push({
          id: 't' + (state.nextTaskId++),
          title: 'AI 建议关注：' + pred.recommendation,
          owner: 'AI助手',
          status: 'todo'
        });
        project.updatedAt = '刚刚';
      }
      showToast('已采纳：已创建关注任务', 'success');
      renderImpact();
    } else {
      // 停滞：标记为高风险项目
      if (project) project.riskLevel = 'high';
      showToast('已采纳：已标记为高风险项目', 'success');
      // 当前在 impact 视图时只刷新仪表盘；在 projects 视图时才调 renderProjectList
      if (state.view === 'projects') {
        renderProjectList();
      } else {
        renderImpact();
      }
    }
  };
}

function initTabs() {

    // 管理后台：若在详情则留在详情，否则回列表
    if (state.view === 'detail' && state.currentProjectId) {
      switchView('detail');

  });
  document.getElementById('tab-mobile').addEventListener('click', function () {
    switchView('mobile');
  });
  document.getElementById('tab-impact').addEventListener('click', function () {
    switchView('impact');
  });

  // 方向键切换 tab
  const tabs = Array.prototype.slice.call(document.querySelectorAll('.tab-btn'));
  tabs.forEach(function (tab, index) {
    tab.addEventListener('keydown', function (e) {
      if (e.key !== 'ArrowLeft' && e.key !== 'ArrowRight') return;
      e.preventDefault();
      const dir = e.key === 'ArrowRight' ? 1 : -1;
      const next = tabs[(index + dir + tabs.length) % tabs.length];
      next.focus();
      next.click();
    });
  });
}

   Onboarding Tour（首次使用引导）

const ONBOARDING_KEY = 'onboarding-completed-bridge';
const onboardingSteps = [
  {
    selector: '.project-card',
    title: '项目卡片',
    desc: 'Bridge 的主页展示所有公益项目卡片，点击任意卡片可进入项目详情与任务看板。',

  },

    prepare: function () {
      switchView('mobile');
    }

];
let onboardingIndex = 0;
let onboardingActive = false;
let onboardingRetryCount = 0;   // target 缺失时的重试计数器（P0-5）
let onboardingTriggerEl = null; // Onboarding 触发元素，用于结束时恢复焦点（P1-17）

function buildOnboardingDom() {
  if (document.querySelector('.onboarding-overlay')) return;
  const overlay = document.createElement('div');
  overlay.className = 'onboarding-overlay';
  document.body.appendChild(overlay);
  const highlight = document.createElement('div');
  highlight.className = 'onboarding-highlight';
  document.body.appendChild(highlight);
  const tooltip = document.createElement('div');
  tooltip.className = 'onboarding-tooltip';
  tooltip.setAttribute('role', 'dialog');
  tooltip.setAttribute('aria-modal', 'true');
  tooltip.setAttribute('aria-labelledby', 'onboarding-title');
  tooltip.setAttribute('aria-live', 'polite');
  tooltip.style.visibility = 'hidden';
  document.body.appendChild(tooltip);
}

function onboardingKeydown(e) {
  if (e.key === 'Escape' && onboardingActive) { skipOnboarding(); return; }
  // Tab/Shift+Tab 焦点陷阱：将焦点限制在 tooltip 内
  if (e.key !== 'Tab' || !onboardingActive) return;
  const tooltip = document.querySelector('.onboarding-tooltip');
  if (!tooltip) return;
  const focusables = tooltip.querySelectorAll('button, [href], input, select, textarea, [tabindex]:not([tabindex="-1"])');
  if (focusables.length === 0) return;
  e.preventDefault();
  const idx = Array.from(focusables).indexOf(document.activeElement);
  const next = e.shiftKey
    ? (idx <= 0 ? focusables[focusables.length - 1] : focusables[idx - 1])
    : (idx >= focusables.length - 1 ? focusables[0] : focusables[idx + 1]);
  if (next) next.focus();
}

function startOnboarding() {
  if (onboardingActive) return;
  onboardingActive = true;
  onboardingIndex = 0;
  onboardingRetryCount = 0;
  // 保存触发元素，用于结束时恢复焦点
  onboardingTriggerEl = document.activeElement;
  // 给 body 加 onboarding-active 类，从根源消除 viewFade 干扰 getBoundingClientRect()
  document.body.classList.add('onboarding-active');
  buildOnboardingDom();
  showStep();
  window.addEventListener('resize', onboardingReposition);
  window.addEventListener('scroll', onboardingReposition, true);
  document.addEventListener('keydown', onboardingKeydown);
}

let onboardingRafId = null;

function positionOnboarding(isScrollReposition) {
  if (onboardingRafId) { cancelAnimationFrame(onboardingRafId); onboardingRafId = null; }
  const step = onboardingSteps[onboardingIndex];
  if (!step) return;
  const target = document.querySelector(step.selector);
  const highlight = document.querySelector('.onboarding-highlight');
  const tooltip = document.querySelector('.onboarding-tooltip');
  if (!target || !highlight || !tooltip) return;
  // 滚动/resize 重定位时禁用过渡，避免高亮框与 tooltip 滞后于目标造成视觉偏移
  if (isScrollReposition) {
    highlight.classList.add('no-transition');
    tooltip.classList.add('no-transition');
  } else {
    highlight.classList.remove('no-transition');
    tooltip.classList.remove('no-transition');
  }
  const rect = target.getBoundingClientRect();
  const pad = 6;
  highlight.style.left = (rect.left - pad) + 'px';
  highlight.style.top = (rect.top - pad) + 'px';
  highlight.style.width = (rect.width + pad * 2) + 'px';
  highlight.style.height = (rect.height + pad * 2) + 'px';
  const tipH = tooltip.offsetHeight || 180;
  const tipW = 320;
  const placeBelow = (rect.bottom + tipH + 24 <= window.innerHeight);
  const top = placeBelow ? rect.bottom + 16 : rect.top - tipH - 16;
  let left = rect.left + (rect.width / 2) - (tipW / 2);
  if (left < 12) left = 12;
  if (left + tipW > window.innerWidth - 12) left = window.innerWidth - tipW - 12;
  tooltip.style.left = left + 'px';
  tooltip.style.top = Math.max(12, top) + 'px';
  tooltip.style.visibility = 'visible';
}

function onboardingReposition() {
  if (!onboardingActive) return;
  if (onboardingRafId) cancelAnimationFrame(onboardingRafId);
  onboardingRafId = requestAnimationFrame(function() { positionOnboarding(true); });
}

function showStep() {
  const step = onboardingSteps[onboardingIndex];
  if (!step) return completeOnboarding();
  // 前置准备（如切换视图）
  const hadPrepare = typeof step.prepare === 'function';
  if (hadPrepare) {
    step.prepare();
  }
  const target = document.querySelector(step.selector);
  const highlight = document.querySelector('.onboarding-highlight');
  const tooltip = document.querySelector('.onboarding-tooltip');
  if (!target || !highlight || !tooltip) {
    // target 缺失（如骨架屏阶段）时不递增 index，setTimeout 重试
    // 最多重试 10 次（约 1 秒）后放弃，避免无限循环
    onboardingRetryCount++;
    if (onboardingRetryCount > 10) {
      onboardingRetryCount = 0;
      return completeOnboarding();
    }
    return setTimeout(showStep, 100);
  }
  onboardingRetryCount = 0;

  const isLast = onboardingIndex === onboardingSteps.length - 1;
  tooltip.innerHTML =
    '<div class="onboarding-step">第 ' + (onboardingIndex + 1) + ' / ' + onboardingSteps.length + ' 步</div>' +
    '<div class="onboarding-title" id="onboarding-title">' + step.title + '</div>' +
    '<div class="onboarding-desc">' + step.desc + '</div>' +
    '<div class="onboarding-actions">' +
      '<span class="onboarding-progress">' + (onboardingIndex + 1) + ' / ' + onboardingSteps.length + '</span>' +
      '<div class="onboarding-btns">' +
        (!isLast ? '<button class="onboarding-btn-skip" id="onboarding-skip" type="button">跳过</button>' : '') +
        '<button class="onboarding-btn-next" id="onboarding-next" type="button">' + (isLast ? '开始体验' : '下一步') + '</button>' +
      '</div>' +
    '</div>';

  // 高亮 + tooltip 定位（抽成独立函数，scroll 时复用，避免重建 innerHTML）
  // prepare 切换视图后会触发 viewFade 入场动画(transform: translateY(8px))，污染 getBoundingClientRect()
  // 用 rAF 延迟一帧让动画推进，避免 highlight 定位偏移 8px
  if (hadPrepare) {
    requestAnimationFrame(positionOnboarding);
  } else {
    positionOnboarding();
  }

  const nextBtn = document.getElementById('onboarding-next');
  if (nextBtn) nextBtn.onclick = nextStep;
  const skipBtn = document.getElementById('onboarding-skip');
  if (skipBtn) skipBtn.onclick = skipOnboarding;
  if (nextBtn) nextBtn.focus();
}

let onboardingTransitioning = false;
function nextStep() {
  if (onboardingTransitioning) return;
  onboardingTransitioning = true;
  setTimeout(function () { onboardingTransitioning = false; }, 350);
  onboardingIndex++;
  if (onboardingIndex >= onboardingSteps.length) {
    completeOnboarding();
  } else {
    showStep();
  }
}

function skipOnboarding() {
  completeOnboarding();
}

function completeOnboarding() {
  onboardingActive = false;
  if (onboardingRafId) cancelAnimationFrame(onboardingRafId);
  safeSetItem(ONBOARDING_KEY, '1');
  window.removeEventListener('resize', onboardingReposition);
  window.removeEventListener('scroll', onboardingReposition, true);
  document.removeEventListener('keydown', onboardingKeydown);
  document.body.classList.remove('onboarding-active');
  ['onboarding-overlay', 'onboarding-highlight', 'onboarding-tooltip'].forEach(cls => {
    const el = document.querySelector('.' + cls);
    if (el) el.remove();
  });
  // 恢复焦点到触发元素
  if (onboardingTriggerEl && typeof onboardingTriggerEl.focus === 'function') {
    onboardingTriggerEl.focus();
    onboardingTriggerEl = null;
  }
}

function initOnboarding() {
  const btn = document.getElementById('help-btn');
  if (btn) {
    btn.addEventListener('click', () => {
      safeRemoveItem(ONBOARDING_KEY);
      startOnboarding();
    });
  }
  if (!safeGetItem(ONBOARDING_KEY)) {
    setTimeout(startOnboarding, 900);
  }
}

if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', initOnboarding);
} else {
  initOnboarding();
}
</script>
</body>
</html>
