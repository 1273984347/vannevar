# 功能建议表单 —— GitHub Issue Form
# 语法参考：https://docs.github.com/issues/using-templates/creating-issue-forms
name: 功能建议 / Feature Request
description: 为 Vannevar 三个产品提出新功能或改进建议
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: dropdown
    id: product
    attributes:
      label: 涉及产品 / Affected product
      description: 该建议面向哪个产品？
      options:
        - focus —— Focus MVP 扩展（Chrome MV3）
        - muse —— Muse MVP 扩展（Chrome MV3）
        - bridge —— Bridge MVP 服务（FastAPI + SQLite）
        - 跨产品 / Cross-product（focus + muse + bridge）
    validations:
      required: true

  - type: textarea
    id: feature
    attributes:
      label: 功能描述 / Feature description
      description: 你希望增加的功能是什么？请具体说明它做什么、解决什么问题。
      placeholder: 希望在 Focus 的任务列表中支持按「预计耗时」排序……
    validations:
      required: true

  - type: textarea
    id: scenario
    attributes:
      label: 使用场景 / Use case
      description: 在什么场景下会用到它？当时的处境、频率与影响。
      placeholder: |
        我在整理一周的专注记录时……
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 期望方案 / Proposed solution
      description: 你设想的实现方式或交互形态；若已有替代方案，也请一并说明。
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 备选方案 / Alternatives considered
      description: 可选。你尝试过的其他做法，或维持现状的影响。
    validations:
      required: false

  - type: textarea
    id: extra
    attributes:
      label: 补充信息 / Anything else
      description: 可选。界面草图、参考链接或其他背景材料。
    validations:
      required: false
