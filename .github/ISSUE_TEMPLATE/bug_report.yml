# Bug 报告表单 —— GitHub Issue Form
# 语法参考：https://docs.github.com/issues/using-templates/creating-issue-forms
name: Bug 报告 / Bug Report
description: 报告 Vannevar 三个产品（Focus / Muse / Bridge）中的缺陷
title: "[Bug] "
labels: ["bug"]
body:
  - type: dropdown
    id: product
    attributes:
      label: 涉及产品 / Affected product
      description: 该问题出现在哪个产品上？
      options:
        - focus —— Focus MVP 扩展（Chrome MV3）
        - muse —— Muse MVP 扩展（Chrome MV3）
        - bridge —— Bridge MVP 服务（FastAPI + SQLite）
        - 跨产品 / Cross-product（focus + muse + bridge）
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: 问题描述 / What happened
      description: 描述实际发生的现象，以及你期望发生的结果。
      placeholder: |
        实际结果：……
        期望结果：……
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 复现步骤 / Steps to reproduce
      description: 请按顺序列出可稳定复现问题的步骤。
      placeholder: |
        1. 打开 Focus 扩展
        2. 点击「开始专注」
        3. 观察到……
    validations:
      required: true

  - type: input
    id: chrome-version
    attributes:
      label: Chrome 版本 / Chrome version
      description: 浏览器版本，例如 Chrome 131.0.6778.86（可在 chrome://version 查看）。
      placeholder: "131.0.6778.86"
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: 操作系统 / Operating system
      description: 操作系统与版本，例如 Windows 11 23H2 / macOS 15.1 / Ubuntu 24.04。
      placeholder: "Windows 11 23H2"
    validations:
      required: true

  - type: input
    id: python-version
    attributes:
      label: Python 版本 / Python version
      description: 仅 Bridge 相关问题需要填写，例如 3.12.10。
      placeholder: "3.12.10"
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: 附加日志 / Additional logs
      description: |
        可选。粘贴相关控制台输出、扩展后台日志或 Bridge 服务端日志。
        请先移除其中的 Token、密码等敏感信息。
    validations:
      required: false

  - type: textarea
    id: extra
    attributes:
      label: 补充信息 / Anything else
      description: 可选。截图、录屏链接或其他有助于定位问题的材料。
    validations:
      required: false
