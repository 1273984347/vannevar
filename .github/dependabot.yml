# Dependabot 依赖更新配置
#
# 说明：
#   - 仓库根目录没有 package.json（Focus / Muse 扩展为零依赖原生 JS），
#     因此不配置 npm 生态，只配置 github-actions 与 pip。
#   - pip 生态会扫描 /products/bridge-mvp 目录下的 requirements*.txt，
#     即同时覆盖 requirements.txt（运行时依赖）与 requirements-dev.txt（测试依赖）。
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5

  - package-ecosystem: "pip"
    directory: "/products/bridge-mvp"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
