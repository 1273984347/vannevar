<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vannevar · Focus 主视觉海报</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --c-bg: #0f172a;
      --c-surface: #1e293b;
      --c-primary: #3b82f6;
      --c-primary-light: #60a5fa;
      --c-text: #f8fafc;
      --c-text-secondary: #94a3b8;
      --c-accent: #1d4ed8;
      --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      width: 1200px;
      height: 1600px;
      font-family: 'Inter', 'Noto Sans SC', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--c-bg);
      color: var(--c-text);
      overflow: hidden;
      position: relative;
    }

    .bg-grid {
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(rgba(59, 130, 246, 0.06) 1px, transparent 1px),
        linear-gradient(90deg, rgba(59, 130, 246, 0.06) 1px, transparent 1px);
      background-size: 48px 48px;
      mask-image: radial-gradient(circle at 50% 30%, black 0%, transparent 70%);
      -webkit-mask-image: radial-gradient(circle at 50% 30%, black 0%, transparent 70%);
    }

    .glow {
      position: absolute;
      border-radius: 50%;
      filter: blur(120px);
      opacity: 0.35;
      pointer-events: none;
    }
    .glow--1 { width: 560px; height: 560px; background: #3b82f6; top: -180px; right: -120px; }
    .glow--2 { width: 400px; height: 400px; background: #1e293b; bottom: -100px; left: -80px; opacity: 0.6; }

    .poster {
      position: relative;
      z-index: 2;
      height: 100%;
      padding: 80px 96px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .brand-row {
      display: flex;
      align-items: center;
      gap: 16px;
    }
    .brand-logo {
      width: 56px;
      height: 56px;
      border-radius: 16px;
      background: linear-gradient(135deg, #1e293b, #3b82f6);
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      box-shadow: 0 12px 32px -8px rgba(59, 130, 246, 0.35);
    }
    .brand-logo svg { width: 32px; height: 32px; }
    .brand-name { font-size: 1.25rem; font-weight: 700; letter-spacing: -0.02em; color: var(--c-text-secondary); }

    .hero {
      margin-top: 48px;
    }
    .product-label {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 16px;
      border-radius: 99px;
      background: rgba(59, 130, 246, 0.12);
      color: var(--c-primary-light);
      font-size: 0.875rem;
      font-weight: 600;
      margin-bottom: 24px;
    }
    .product-title {
      font-size: 5.5rem;
      font-weight: 800;
      letter-spacing: -0.04em;
      line-height: 1.05;
      margin-bottom: 24px;
      background: linear-gradient(135deg, #f8fafc 0%, #60a5fa 100%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }
    .tagline {
      font-size: 1.75rem;
      color: var(--c-text-secondary);
      line-height: 1.6;
      max-width: 720px;
    }

    .ui-preview {
      position: relative;
      margin-top: 56px;
      height: 560px;
      border-radius: 24px;
      background: linear-gradient(135deg, rgba(30, 41, 59, 0.8), rgba(15, 23, 42, 0.9));
      border: 1px solid rgba(59, 130, 246, 0.15);
      box-shadow: 0 32px 80px -24px rgba(0, 0, 0, 0.45);
      overflow: hidden;
      display: flex;
    }
    .ui-sidebar {
      width: 240px;
      border-right: 1px solid rgba(148, 163, 184, 0.1);
      padding: 28px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .ui-avatar {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      background: linear-gradient(135deg, #3b82f6, #1d4ed8);
    }
    .ui-nav-line {
      height: 12px;
      border-radius: 6px;
      background: rgba(148, 163, 184, 0.12);
    }
    .ui-nav-line.active {
      width: 70%;
      background: rgba(59, 130, 246, 0.35);
    }
    .ui-main {
      flex: 1;
      padding: 32px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }
    .ui-search {
      height: 44px;
      border-radius: 12px;
      background: rgba(148, 163, 184, 0.08);
      border: 1px solid rgba(148, 163, 184, 0.12);
    }
    .ui-card {
      padding: 20px;
      border-radius: 16px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(148, 163, 184, 0.08);
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .ui-card-row {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .ui-favicon {
      width: 28px;
      height: 28px;
      border-radius: 8px;
      background: rgba(59, 130, 246, 0.25);
    }
    .ui-line {
      height: 10px;
      border-radius: 5px;
      background: rgba(148, 163, 184, 0.12);
    }
    .ui-line.short { width: 45%; }
    .ui-line.medium { width: 70%; }
    .ui-badge {
      align-self: flex-start;
      padding: 6px 12px;
      border-radius: 99px;
      background: rgba(59, 130, 246, 0.15);
      color: var(--c-primary-light);
      font-size: 0.75rem;
      font-weight: 600;
    }

    .features {
      margin-top: 48px;
      display: flex;
      gap: 32px;
    }
    .feature {
      flex: 1;
      padding: 24px;
      border-radius: 16px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(148, 163, 184, 0.08);
    }
    .feature-icon {
      width: 40px;
      height: 40px;
      border-radius: 10px;
      background: rgba(59, 130, 246, 0.15);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--c-primary-light);
      margin-bottom: 16px;
    }
    .feature-icon svg { width: 22px; height: 22px; }
    .feature-title { font-size: 1.125rem; font-weight: 700; margin-bottom: 8px; }
    .feature-desc { font-size: 0.95rem; color: var(--c-text-secondary); line-height: 1.6; }

    .footer {
      margin-top: auto;
      padding-top: 48px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: var(--c-text-secondary);
      font-size: 0.95rem;
    }
    .footer-slogan {
      font-size: 1.125rem;
      font-weight: 600;
      color: var(--c-text);
    }
  </style>
</head>
<body>
  <div class="bg-grid"></div>
  <div class="glow glow--1"></div>
  <div class="glow glow--2"></div>

  <div class="poster">
    <div class="brand-row">
      <div class="brand-logo" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6 L12 18 L20 6"/></svg>
      </div>
      <div class="brand-name">Vannevar</div>
    </div>

    <div class="hero">
      <div class="product-label">效率工具 · 浏览器扩展</div>
      <h1 class="product-title">Focus</h1>
      <p class="tagline">一键保存与恢复完整浏览器上下文，让深度工作在切换中保持不断档。</p>

      <div class="ui-preview" aria-hidden="true">
        <div class="ui-sidebar">
          <div class="ui-avatar"></div>
          <div class="ui-nav-line active"></div>
          <div class="ui-nav-line"></div>
          <div class="ui-nav-line"></div>
          <div class="ui-nav-line"></div>
        </div>
        <div class="ui-main">
          <div class="ui-search"></div>
          <div class="ui-card">
            <div class="ui-card-row">
              <div class="ui-favicon"></div>
              <div class="ui-line medium"></div>
            </div>
            <div class="ui-line short"></div>
            <div class="ui-badge">上下文快照</div>
          </div>
          <div class="ui-card">
            <div class="ui-card-row">
              <div class="ui-favicon"></div>
              <div class="ui-line medium"></div>
            </div>
            <div class="ui-line short"></div>
            <div class="ui-badge">本地优先</div>
          </div>
        </div>
      </div>
    </div>

    <div class="features">
      <div class="feature">
        <div class="feature-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="3" width="20" height="14" rx="2" ry="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/></svg>
        </div>
        <div class="feature-title">保存当前上下文</div>
        <div class="feature-desc">记录所有标签页的标题与 URL，形成可恢复的工作快照。</div>
      </div>
      <div class="feature">
        <div class="feature-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/></svg>
        </div>
        <div class="feature-title">一键恢复会话</div>
        <div class="feature-desc">关闭标签页后也能随时回到之前的工作状态。</div>
      </div>
      <div class="feature">
        <div class="feature-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
        </div>
        <div class="feature-title">本地安全存储</div>
        <div class="feature-desc">数据保存在本地，不上云、不追踪，URL  scheme 白名单防护。</div>
      </div>
    </div>

    <div class="footer">
      <div class="footer-slogan">让信息在恰当的时机，出现在恰当的地方。</div>
      <div>Vannevar · 上下文管理产品族</div>
    </div>
  </div>
</body>
</html>
