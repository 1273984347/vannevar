<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vannevar · Muse 技术架构</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', 'Noto Sans SC', sans-serif; }
    .arrow { position: relative; }
    .arrow::after {
      content: '';
      position: absolute;
      bottom: -16px;
      left: 50%;
      transform: translateX(-50%);
      width: 0;
      height: 0;
      border-left: 8px solid transparent;
      border-right: 8px solid transparent;
      border-top: 12px solid #fdba74;
    }
  </style>
</head>
<body class="bg-orange-50 p-8">
  <div class="max-w-4xl mx-auto">
    <div class="text-center mb-8">
      <h1 class="text-2xl font-bold text-stone-800">Vannevar · Muse 技术架构</h1>
      <p class="text-stone-500 mt-2">生活娱乐 · 创作现场的保存与恢复</p>
    </div>

    <!-- 用户交互层 -->
    <div class="bg-white rounded-xl shadow-sm border border-orange-100 p-6 mb-6">
      <div class="text-xs font-semibold text-stone-400 uppercase tracking-wider mb-4">用户交互层</div>
      <div class="grid grid-cols-3 gap-4">
        <div class="bg-orange-50 border border-orange-100 rounded-lg p-4 text-center">
          <div class="text-2xl mb-2">🎨</div>
          <div class="font-semibold text-stone-700">桌面端应用</div>
          <div class="text-xs text-stone-500 mt-1">创作控制中心</div>
        </div>
        <div class="bg-orange-50 border border-orange-100 rounded-lg p-4 text-center">
          <div class="text-2xl mb-2">🔌</div>
          <div class="font-semibold text-stone-700">创作插件</div>
          <div class="text-xs text-stone-500 mt-1">Figma / PS / Logic</div>
        </div>
        <div class="bg-orange-50 border border-orange-100 rounded-lg p-4 text-center">
          <div class="text-2xl mb-2">🏛️</div>
          <div class="font-semibold text-stone-700">灵感博物馆</div>
          <div class="text-xs text-stone-500 mt-1">时间轴画廊</div>
        </div>
      </div>
    </div>

    <div class="arrow h-6 mb-6"></div>

    <!-- 核心引擎层 -->
    <div class="bg-gradient-to-r from-orange-700 to-amber-600 rounded-xl shadow-md p-6 mb-6">
      <div class="text-xs font-semibold text-orange-100 uppercase tracking-wider mb-4">Muse Engine 创作内核</div>
      <div class="grid grid-cols-3 gap-4">
        <div class="bg-white/10 backdrop-blur rounded-lg p-4 text-center">
          <div class="text-2xl mb-2">🎵</div>
          <div class="font-semibold text-white">Ambience</div>
          <div class="text-xs text-orange-100 mt-1">氛围捕获</div>
        </div>
        <div class="bg-white/10 backdrop-blur rounded-lg p-4 text-center">
          <div class="text-2xl mb-2">🖼️</div>
          <div class="font-semibold text-white">Materials</div>
          <div class="text-xs text-orange-100 mt-1">素材归档</div>
        </div>
        <div class="bg-white/10 backdrop-blur rounded-lg p-4 text-center">
          <div class="text-2xl mb-2">✍️</div>
          <div class="font-semibold text-white">Resume</div>
          <div class="text-xs text-orange-100 mt-1">创作状态恢复</div>
        </div>
      </div>
    </div>

    <div class="arrow h-6 mb-6"></div>

    <!-- 数据存储层 -->
    <div class="bg-white rounded-xl shadow-sm border border-orange-100 p-6">
      <div class="text-xs font-semibold text-stone-400 uppercase tracking-wider mb-4">数据存储层 · 项目制</div>
      <div class="grid grid-cols-3 gap-4">
        <div class="bg-orange-50/50 border border-orange-100 rounded-lg p-4 text-center">
          <div class="text-2xl mb-2">📒</div>
          <div class="font-semibold text-stone-700">项目元数据</div>
          <div class="text-xs text-stone-500 mt-1">创作项目索引</div>
        </div>
        <div class="bg-orange-50/50 border border-orange-100 rounded-lg p-4 text-center">
          <div class="text-2xl mb-2">🎞️</div>
          <div class="font-semibold text-stone-700">媒体文件索引</div>
          <div class="text-xs text-stone-500 mt-1">参考图与音视频</div>
        </div>
        <div class="bg-orange-50/50 border border-orange-100 rounded-lg p-4 text-center">
          <div class="text-2xl mb-2">📝</div>
          <div class="font-semibold text-stone-700">创作软件状态</div>
          <div class="text-xs text-stone-500 mt-1">工作区与光标位置</div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
