<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vannevar · Focus 技术架构</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', 'Noto Sans SC', sans-serif; }
    .arrow { position: relative; }
    .arrow::after {
      content: '';
      position: absolute;
      bottom: -16px;
      left: 50%;
      transform: translateX(-50%);
      width: 0;
      height: 0;
      border-left: 8px solid transparent;
      border-right: 8px solid transparent;
      border-top: 12px solid #94a3b8;
    }
  </style>
</head>
<body class="bg-slate-50 p-8">
  <div class="max-w-4xl mx-auto">
    <div class="text-center mb-8">
      <h1 class="text-2xl font-bold text-slate-800">Vannevar · Focus 技术架构</h1>
      <p class="text-slate-500 mt-2">学习工作 · 上下文保存与恢复</p>
    </div>

    <!-- 用户交互层 -->
    <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-6 mb-6">
      <div class="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-4">用户交互层</div>
      <div class="grid grid-cols-3 gap-4">
        <div class="bg-blue-50 border border-blue-100 rounded-lg p-4 text-center">
          <div class="text-2xl mb-2">🧩</div>
          <div class="font-semibold text-slate-700">浏览器插件</div>
          <div class="text-xs text-slate-500 mt-1">Chrome / Edge</div>
        </div>
        <div class="bg-blue-50 border border-blue-100 rounded-lg p-4 text-center">
          <div class="text-2xl mb-2">🖥️</div>
          <div class="font-semibold text-slate-700">桌面端应用</div>
          <div class="text-xs text-slate-500 mt-1">Tauri / Electron</div>
        </div>
        <div class="bg-blue-50 border border-blue-100 rounded-lg p-4 text-center">
          <div class="text-2xl mb-2">📊</div>
          <div class="font-semibold text-slate-700">Web 仪表盘</div>
          <div class="text-xs text-slate-500 mt-1">历史记录管理</div>
        </div>
      </div>
    </div>

    <div class="arrow h-6 mb-6"></div>

    <!-- 核心引擎层 -->
    <div class="bg-gradient-to-r from-slate-800 to-slate-700 rounded-xl shadow-md p-6 mb-6">
      <div class="text-xs font-semibold text-slate-300 uppercase tracking-wider mb-4">Context Engine 共享内核</div>
      <div class="grid grid-cols-3 gap-4">
        <div class="bg-white/10 backdrop-blur rounded-lg p-4 text-center">
          <div class="text-2xl mb-2">📸</div>
          <div class="font-semibold text-white">Snapshot</div>
          <div class="text-xs text-slate-300 mt-1">上下文捕获</div>
        </div>
        <div class="bg-white/10 backdrop-blur rounded-lg p-4 text-center">
          <div class="text-2xl mb-2">↩️</div>
          <div class="font-semibold text-white">Recall</div>
          <div class="text-xs text-slate-300 mt-1">状态恢复</div>
        </div>
        <div class="bg-white/10 backdrop-blur rounded-lg p-4 text-center">
          <div class="text-2xl mb-2">🤖</div>
          <div class="font-semibold text-white">Resume</div>
          <div class="text-xs text-slate-300 mt-1">AI Session 摘要</div>
        </div>
      </div>
    </div>

    <div class="arrow h-6 mb-6"></div>

    <!-- 数据存储层 -->
    <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-6">
      <div class="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-4">数据存储层 · 本地优先</div>
      <div class="grid grid-cols-3 gap-4">
        <div class="bg-slate-50 border border-slate-200 rounded-lg p-4 text-center">
          <div class="text-2xl mb-2">🗄️</div>
          <div class="font-semibold text-slate-700">SQLite</div>
          <div class="text-xs text-slate-500 mt-1">结构化上下文数据</div>
        </div>
        <div class="bg-slate-50 border border-slate-200 rounded-lg p-4 text-center">
          <div class="text-2xl mb-2">📁</div>
          <div class="font-semibold text-slate-700">文件索引</div>
          <div class="text-xs text-slate-500 mt-1">本地文件路径映射</div>
        </div>
        <div class="bg-slate-50 border border-slate-200 rounded-lg p-4 text-center">
          <div class="text-2xl mb-2">☁️</div>
          <div class="font-semibold text-slate-700">可选云端同步</div>
          <div class="text-xs text-slate-500 mt-1">端到端加密</div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
